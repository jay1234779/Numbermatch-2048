<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>2048 Number Puzzle</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8f7a66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#faf8ef;
  color:#776e65;
  overflow-x:hidden;
}

body{
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:500px;
  padding:18px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.title{
  font-size:48px;
  font-weight:900;
  color:#776e65;
  margin:0;
}

.scores{
  display:flex;
  gap:7px;
}

.score-box{
  background:#bbada0;
  color:white;
  min-width:75px;
  padding:7px 10px;
  border-radius:5px;
  text-align:center;
}

.score-label{
  font-size:11px;
  font-weight:bold;
  text-transform:uppercase;
}

.score-value{
  font-size:22px;
  font-weight:bold;
  margin-top:2px;
}

.description{
  font-size:16px;
  margin:5px 0 15px;
  line-height:1.4;
}

.buttons{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:5px;
  background:#8f7a66;
  color:white;
  padding:12px 14px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.96);
}

.board{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#bbada0;
  border-radius:7px;
  padding:9px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:9px;
  touch-action:none;
  user-select:none;
}

.cell{
  background:rgba(238,228,218,.35);
  border-radius:5px;
}

.tile{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  border-radius:5px;
  transition:transform .12s ease;
  z-index:2;
}

.tile-2{background:#eee4da;color:#776e65}
.tile-4{background:#ede0c8;color:#776e65}
.tile-8{background:#f2b179;color:white}
.tile-16{background:#f59563;color:white}
.tile-32{background:#f67c5f;color:white}
.tile-64{background:#f65e3b;color:white}
.tile-128{background:#edcf72;color:white}
.tile-256{background:#edcc61;color:white}
.tile-512{background:#edc850;color:white}
.tile-1024{background:#edc53f;color:white}
.tile-2048{background:#edc22e;color:white}
.tile-big{background:#3c3a32;color:white}

.info{
  margin-top:18px;
  background:#eee4da;
  padding:13px;
  border-radius:6px;
  font-size:14px;
  line-height:1.5;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(238,228,218,.78);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
  padding:20px;
}

.overlay.show{
  display:flex;
}

.overlay-box{
  width:100%;
  max-width:340px;
  background:white;
  border-radius:12px;
  padding:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.overlay-box h2{
  margin-top:0;
  font-size:30px;
}

.overlay-box p{
  margin-bottom:20px;
}

@media(max-width:420px){
  .title{
    font-size:42px;
  }

  .container{
    padding:12px;
  }

  .board{
    gap:7px;
    padding:7px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1 class="title">2048</h1>

    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div id="score" class="score-value">0</div>
      </div>

      <div class="score-box">
        <div class="score-label">Best</div>
        <div id="best" class="score-value">0</div>
      </div>
    </div>
  </div>

  <div class="description">
    Join the numbers and get to the <b>2048 tile!</b>
  </div>

  <div class="buttons">
    <button onclick="newGame()">NEW GAME</button>
    <button onclick="undo()">UNDO</button>
    <button onclick="restart()">RESTART</button>
  </div>

  <div id="board" class="board"></div>

  <div class="info">
    <b>How to play:</b><br>
    Swipe up, down, left or right to move the tiles.
    When two tiles with the same number touch, they merge into one.
  </div>

</div>

<div id="overlay" class="overlay">
  <div class="overlay-box">
    <h2 id="overlayTitle">Game Over!</h2>
    <p id="overlayText">No more moves available.</p>

    <button onclick="newGame()">TRY AGAIN</button>
  </div>
</div>

<script>

const SIZE = 4;

let board = [];
let score = 0;
let best = Number(localStorage.getItem("NUMBER_2048_BEST") || 0);

let history = [];

const boardElement = document.getElementById("board");
const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");

bestElement.textContent = best;


/* ---------------- GAME ---------------- */

function newGame(){

  board = Array.from(
    {length:SIZE},
    () => Array(SIZE).fill(0)
  );

  score = 0;
  history = [];

  overlay.classList.remove("show");

  addRandomTile();
  addRandomTile();

  update();
}


function restart(){
  newGame();
}


function addRandomTile(){

  const empty = [];

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(board[r][c] === 0){
        empty.push([r,c]);
      }

    }
  }

  if(empty.length === 0) return;

  const [r,c] = empty[
    Math.floor(Math.random()*empty.length)
  ];

  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}


/* ---------------- RENDER ---------------- */

function update(){

  boardElement.innerHTML = "";

  for(let r=0;r<SIZE;r++){

    for(let c=0;c<SIZE;c++){

      const cell = document.createElement("div");
      cell.className = "cell";

      boardElement.appendChild(cell);

    }

  }

  const rect = boardElement.getBoundingClientRect();

  const gap = parseFloat(
    getComputedStyle(boardElement).gap
  );

  const padding = parseFloat(
    getComputedStyle(boardElement).padding
  );

  const size =
    (rect.width - padding*2 - gap*3) / 4;

  for(let r=0;r<SIZE;r++){

    for(let c=0;c<SIZE;c++){

      const value = board[r][c];

      if(value === 0) continue;

      const tile = document.createElement("div");

      tile.className =
        "tile " +
        (value <= 2048
          ? "tile-"+value
          : "tile-big");

      tile.textContent = value;

      if(value >= 1024){
        tile.style.fontSize =
          Math.max(18, size*0.22)+"px";
      }else if(value >= 100){
        tile.style.fontSize =
          Math.max(20, size*0.28)+"px";
      }else{
        tile.style.fontSize =
          Math.max(24, size*0.34)+"px";
      }

      tile.style.width = size+"px";
      tile.style.height = size+"px";

      tile.style.left =
        (padding + c*(size+gap))+"px";

      tile.style.top =
        (padding + r*(size+gap))+"px";

      boardElement.appendChild(tile);
    }
  }

  scoreElement.textContent = score;

  if(score > best){

    best = score;

    localStorage.setItem(
      "NUMBER_2048_BEST",
      best
    );
  }

  bestElement.textContent = best;

  checkWin();

  if(!canMove()){
    setTimeout(gameOver,180);
  }
}


/* ---------------- MOVEMENT ---------------- */

function moveLine(line){

  let arr = line.filter(x => x !== 0);

  let result = [];
  let gained = 0;

  for(let i=0;i<arr.length;i++){

    if(i+1 < arr.length &&
       arr[i] === arr[i+1]){

      const merged = arr[i] * 2;

      result.push(merged);

      gained += merged;

      i++;

    }else{

      result.push(arr[i]);

    }
  }

  while(result.length < SIZE){
    result.push(0);
  }

  return {
    line:result,
    gained:gained
  };
}


function move(direction){

  const oldBoard =
    board.map(row => [...row]);

  const oldScore = score;

  let changed = false;

  for(let i=0;i<SIZE;i++){

    let line = [];

    for(let j=0;j<SIZE;j++){

      if(direction === "left")
        line.push(board[i][j]);

      if(direction === "right")
        line.push(board[i][SIZE-1-j]);

      if(direction === "up")
        line.push(board[j][i]);

      if(direction === "down")
        line.push(board[SIZE-1-j][i]);
    }

    const result = moveLine(line);

    if(result.line.join(",") !== line.join(",")){
      changed = true;
    }

    score += result.gained;

    for(let j=0;j<SIZE;j++){

      if(direction === "left")
        board[i][j] = result.line[j];

      if(direction === "right")
        board[i][SIZE-1-j] = result.line[j];

      if(direction === "up")
        board[j][i] = result.line[j];

      if(direction === "down")
        board[SIZE-1-j][i] = result.line[j];
    }
  }

  if(!changed){

    score = oldScore;

    return;
  }

  history.push({
    board:oldBoard,
    score:oldScore
  });

  if(history.length > 20){
    history.shift();
  }

  addRandomTile();

  update();
}


/* ---------------- UNDO ---------------- */

function undo(){

  if(history.length === 0) return;

  const previous = history.pop();

  board =
    previous.board.map(row => [...row]);

  score = previous.score;

  overlay.classList.remove("show");

  update();
}


/* ---------------- GAME STATE ---------------- */

function canMove(){

  for(let r=0;r<SIZE;r++){

    for(let c=0;c<SIZE;c++){

      if(board[r][c] === 0){
        return true;
      }

      if(
        c < SIZE-1 &&
        board[r][c] === board[r][c+1]
      ){
        return true;
      }

      if(
        r < SIZE-1 &&
        board[r][c] === board[r+1][c]
      ){
        return true;
      }
    }
  }

  return false;
}


let won = false;

function checkWin(){

  if(won) return;

  for(let r=0;r<SIZE;r++){

    for(let c=0;c<SIZE;c++){

      if(board[r][c] === 2048){

        won = true;

        overlayTitle.textContent =
          "You Win! 🎉";

        overlayText.textContent =
          "You reached the 2048 tile!";

        overlay.classList.add("show");

        return;
      }
    }
  }
}


function gameOver(){

  if(canMove()) return;

  overlayTitle.textContent =
    "Game Over!";

  overlayText.textContent =
    "No more moves available.";

  overlay.classList.add("show");
}


/* ---------------- KEYBOARD ---------------- */

document.addEventListener("keydown", function(e){

  if(e.key === "ArrowLeft"){
    e.preventDefault();
    move("left");
  }

  if(e.key === "ArrowRight"){
    e.preventDefault();
    move("right");
  }

  if(e.key === "ArrowUp"){
    e.preventDefault();
    move("up");
  }

  if(e.key === "ArrowDown"){
    e.preventDefault();
    move("down");
  }

});


/* ---------------- TOUCH ---------------- */

let startX = 0;
let startY = 0;

boardElement.addEventListener(
  "touchstart",
  function(e){

    const touch = e.touches[0];

    startX = touch.clientX;
    startY = touch.clientY;

  },
  {passive:true}
);


boardElement.addEventListener(
  "touchend",
  function(e){

    const touch = e.changedTouches[0];

    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;

    const minSwipe = 30;

    if(
      Math.abs(dx) < minSwipe &&
      Math.abs(dy) < minSwipe
    ){
      return;
    }

    if(Math.abs(dx) > Math.abs(dy)){

      if(dx > 0)
        move("right");
      else
        move("left");

    }else{

      if(dy > 0)
        move("down");
      else
        move("up");

    }

  },
  {passive:true}
);


/* ---------------- PWA ---------------- */

if("serviceWorker" in navigator){

  window.addEventListener("load", function(){

    navigator.serviceWorker
      .register("./sw.js")
      .then(function(){

        console.log(
          "Service Worker registered successfully"
        );

      })
      .catch(function(error){

        console.log(
          "Service Worker error:",
          error
        );

      });

  });

}


/* START */

newGame();

</script>

</body>
</html>
